<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blue ter Burg, director</title>
<meta name="description" content="Blue ter Burg is a director based in Amsterdam, working worldwide. Work for Puma, KLM, Adidas, Hopeium and Ballontastic.">
<link rel="canonical" href="https://www.bluelouis.nl/">
<meta property="og:type" content="website">
<meta property="og:title" content="Blue ter Burg, director">
<meta property="og:description" content="Director based in Amsterdam. Working worldwide.">
<meta property="og:url" content="https://www.bluelouis.nl/">
<meta property="og:image" content="https://www.bluelouis.nl/media/reel.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0B0B0C">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230B0B0C'/%3E%3Ctext x='16' y='23' font-family='Arial Narrow,Arial,sans-serif' font-weight='700' font-size='20' fill='%23F2F0EB' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="preload" as="image" href="/media/reel.jpg">
<style>
:root{--bg:#0B0B0C;--ink:#F2F0EB;--muted:#8C8A85;--line:#2A2A2D;--accent:#FF5A47;--pad:40px;--mono:ui-monospace,'SF Mono','JetBrains Mono',Menlo,monospace}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
a{color:var(--ink)}a:hover{color:var(--accent)}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.narrow{font-family:var(--mono)}

.hero{position:relative;width:100%;aspect-ratio:16/9;min-height:520px;max-height:100vh;background:#10141C;overflow:hidden}
.hero video,.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.top{position:absolute;left:0;right:0;top:0;padding:20px var(--pad);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;mix-blend-mode:difference;z-index:2}
.top a{color:#fff;text-decoration:none}
.wordmark{font-weight:700;font-size:20px;letter-spacing:.06em;text-transform:uppercase;padding:10px 0}
.top nav{display:flex;flex-wrap:wrap;gap:4px}
.top nav a{font-size:15px;padding:12px 14px}
.top nav a:last-child{padding-right:0}
.hero-foot{position:absolute;left:0;right:0;bottom:0;padding:var(--pad);display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;mix-blend-mode:difference;z-index:2}
.hero-foot p{margin:0;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:#fff}
.hero-foot a{display:flex;align-items:center;gap:10px;text-decoration:none;font-size:15px;padding:12px 0;color:#fff}

.work{display:flex;flex-direction:column;gap:4px;padding-top:4px}
.film{position:relative;display:block;width:100%;aspect-ratio:2.39/1;min-height:300px;overflow:hidden;appearance:none;border:0;padding:0;margin:0;color:var(--ink);font:inherit;text-align:left;cursor:pointer;background:#10141C}
.film img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.film:hover img,.film:focus-visible img{transform:scale(1.03)}
.film:focus-visible{outline-offset:-4px}
.film .scrim{position:absolute;left:0;right:0;bottom:0;height:55%;background:linear-gradient(to top,rgba(5,5,6,.7),rgba(5,5,6,0))}
.film .meta{position:absolute;left:var(--pad);right:var(--pad);bottom:32px;display:flex;flex-direction:column;align-items:flex-start;gap:16px}
.film .title{font-weight:700;font-size:clamp(40px,8.4vw,140px);line-height:.9;letter-spacing:-.04em;text-transform:uppercase}
.film .credit{font-size:13px;letter-spacing:.16em;text-transform:uppercase}

.block{max-width:1440px;margin:0 auto;padding:0 var(--pad)}
.row{display:flex;flex-wrap:wrap;gap:24px 48px}
.row h2{flex:1 1 240px;margin:0;font-weight:500;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.row .body{flex:999 1 560px;min-width:0}
#about{padding-top:128px}
.lead{margin:0 0 24px;font-size:clamp(22px,2.4vw,34px);line-height:1.3;max-width:30ch}
.dev{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline}
.dev span:first-child{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.dev span:last-child{font-size:18px}
#contact{padding-top:96px}
#contact .row{border-top:1px solid var(--line);padding-top:18px}
.direct{display:flex;flex-direction:column;gap:6px}
.direct span{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.direct a{font-size:18px;width:fit-content}
footer{max-width:1440px;margin:0 auto;padding:96px var(--pad) 48px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;font-size:14px;color:var(--muted)}

.player{position:fixed;inset:0;z-index:50;background:#050506;display:none;grid-template-rows:auto 1fr auto;color:var(--ink)}
.player.open{display:grid}
.player.idle{cursor:none}
.player-bar{padding:20px var(--pad);display:flex;align-items:center;justify-content:space-between;gap:12px;transition:opacity .4s}
.player-bar .t{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;min-width:0}
.player-bar .t span:first-child{font-size:18px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.player-bar .t span:last-child{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.close{appearance:none;border:1px solid var(--line);background:none;color:var(--ink);width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.close:hover{border-color:var(--ink)}
.stage{position:relative;min-height:0;display:flex;align-items:center;justify-content:center;background:#000;cursor:pointer}
.stage video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.bigplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);appearance:none;border:0;background:none;color:var(--ink);font:inherit;font-size:13px;letter-spacing:.16em;text-transform:uppercase;padding:14px 18px;cursor:pointer;background:rgba(5,5,6,.55)}
.bigplay[hidden]{display:none}
.loading .bigplay{display:none}
.ctrl{display:grid;grid-template-columns:auto auto 1fr auto auto;align-items:center;gap:0 24px;padding:14px var(--pad) 22px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;transition:opacity .4s}
.ctrl button{appearance:none;border:0;background:none;color:var(--ink);font:inherit;letter-spacing:inherit;text-transform:inherit;padding:10px 0;cursor:pointer;white-space:nowrap}
.ctrl button:hover{color:var(--accent)}
.time{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.time b{color:var(--ink);font-weight:400}
.scrub{position:relative;height:28px;cursor:pointer;touch-action:none;outline:none}
.scrub:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.scrub .rail,.scrub .buf,.scrub .fill{position:absolute;left:0;top:50%;height:2px;margin-top:-1px;transition:height .15s,margin-top .15s}
.scrub .rail{right:0;background:var(--line)}
.scrub .buf{width:0;background:#4A4945}
.scrub .fill{width:0;background:var(--accent)}
.scrub:hover .rail,.scrub:hover .buf,.scrub:hover .fill,.scrub.drag .rail,.scrub.drag .buf,.scrub.drag .fill{height:6px;margin-top:-3px}
.player.idle .player-bar,.player.idle .ctrl{opacity:0}
.player:fullscreen{width:100vw;height:100vh}

@media (max-width:720px){
  :root{--pad:20px}
  .hero{min-height:0;aspect-ratio:4/5}
  .wordmark{font-size:16px}
  .top nav a{padding:12px 8px}
  .film{min-height:220px;aspect-ratio:16/10}
  .film .meta{bottom:20px;gap:10px}
  .film .credit{font-size:11px}
  .film .title{font-size:10.5vw}
  #about{padding-top:88px}
  #contact{padding-top:72px}
  footer{padding-top:72px}
  .ctrl{grid-template-columns:auto 1fr auto auto;gap:0 16px;padding-bottom:18px}
  .ctrl .time{display:none}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.film img{transition:none}}
</style>
</head>
<body>

<section class="hero" id="top">
  <img src="/media/reel.jpg" alt="" aria-hidden="true">
  <video id="reel" src="/media/reel.mp4" poster="/media/reel.jpg" autoplay muted loop playsinline preload="auto" aria-hidden="true"></video>
  <header class="top">
    <a href="#top" class="wordmark narrow">Blue ter Burg</a>
    <nav aria-label="Main">
      <a href="#work">Work</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>
  <div class="hero-foot">
    <p>Director, Amsterdam</p>
    <a href="#work">See the work
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#FFFFFF" stroke-width="1.5" aria-hidden="true"><path d="M8 2v12M3 9l5 5 5-5"/></svg></a>
  </div>
</section>

<main>
<section class="work" id="work" aria-label="Work">
  <button type="button" class="film" data-src="/media/films/hopeium.mp4" data-poster="/media/hopeium.jpg" data-title="Hopeium FW" data-credit="Written &amp; directed" style="background:#10141C">
    <img src="/media/hopeium.jpg" alt="Still from Hopeium FW" loading="lazy" style="object-position:50% 62%">
    <span class="scrim"></span>
    <span class="meta"><span class="title narrow">Hopeium FW</span><span class="credit">Written &amp; directed</span></span>
  </button>
  <button type="button" class="film" data-src="/media/films/puma.mp4" data-poster="/media/puma.jpg" data-title="Puma" data-credit="Written &amp; directed" style="background:#4F5D57">
    <img src="/media/puma.jpg" alt="Still from Puma" loading="lazy" style="object-position:50% 80%">
    <span class="scrim"></span>
    <span class="meta"><span class="title narrow">Puma</span><span class="credit">Written &amp; directed</span></span>
  </button>
  <button type="button" class="film" data-src="/media/films/klm.mp4" data-poster="/media/klm.jpg" data-title="KLM" data-credit="Directed" style="background:#2B3640">
    <img src="/media/klm.jpg" alt="Still from KLM" loading="lazy" style="object-position:50% 40%">
    <span class="scrim"></span>
    <span class="meta"><span class="title narrow">KLM</span><span class="credit">Directed</span></span>
  </button>
  <button type="button" class="film" data-src="/media/films/ballontastic.mp4" data-poster="/media/ballontastic.jpg" data-title="Ballontastic" data-credit="Written &amp; directed" style="background:#24302B">
    <img src="/media/ballontastic.jpg" alt="Still from Ballontastic" loading="lazy" style="object-position:50% 50%">
    <span class="scrim"></span>
    <span class="meta"><span class="title narrow">Ballontastic</span><span class="credit">Written &amp; directed</span></span>
  </button>
  <button type="button" class="film" data-src="/media/films/adidas.mp4" data-poster="/media/adidas.jpg" data-title="Adidas" data-credit="Written &amp; directed" style="background:#8E3B24">
    <img src="/media/adidas.jpg" alt="Still from Adidas" loading="lazy" style="object-position:50% 45%">
    <span class="scrim"></span>
    <span class="meta"><span class="title narrow">Adidas</span><span class="credit">Written &amp; directed</span></span>
  </button>
</section>

<section class="block" id="about">
  <div class="row">
    <h2 class="narrow">About</h2>
    <div class="body">
      <p class="lead">Director based in <i>Amsterdam</i>.<br>Working <i>Worldwide</i></p>
      <div class="dev"><span>In development</span><span>Pornkings, feature film</span></div>
    </div>
  </div>
</section>

<section class="block" id="contact">
  <div class="row">
    <h2 class="narrow">Contact</h2>
    <div class="body">
      <div class="direct">
        <span>Direct</span>
        <a href="mailto:terburgblue@gmail.com">terburgblue@gmail.com</a>
        <a href="tel:+31646064473">+316 46064473</a>
      </div>
    </div>
  </div>
</section>
</main>

<footer>
  <span>© 2026 Blue ter Burg</span>
  <span>bluelouis.nl</span>
</footer>

<div class="player" id="player" role="dialog" aria-modal="true" aria-labelledby="player-title" hidden>
  <div class="player-bar">
    <span class="t"><span id="player-title"></span><span id="player-credit"></span></span>
    <button type="button" class="close" id="player-close" aria-label="Close">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#F2F0EB" stroke-width="1.5" aria-hidden="true"><path d="M3 3l12 12M15 3L3 15"/></svg>
    </button>
  </div>
  <div class="stage" id="stage">
    <video id="pv" playsinline preload="metadata"></video>
    <button type="button" class="bigplay" id="bigplay" hidden>[ Play ]</button>
  </div>
  <div class="ctrl" id="ctrl">
    <button type="button" id="pp">Pause</button>
    <span class="time" aria-live="off"><b id="cur">00:00</b> / <span id="dur">00:00</span></span>
    <div class="scrub" id="scrub" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="00:00"><span class="rail"></span><span class="buf" id="buf"></span><span class="fill" id="fill"></span></div>
    <button type="button" id="mute">Sound on</button>
    <button type="button" id="fs">Full screen</button>
  </div>
</div>

<script>
(function(){
  var reel = document.getElementById('reel');
  function playReel(){ if (!reel) return; reel.muted = true; var p = reel.play && reel.play(); if (p && p.catch) p.catch(function(){}); }
  playReel();

  var player = document.getElementById('player');
  var stage = document.getElementById('stage');
  var v = document.getElementById('pv');
  var big = document.getElementById('bigplay');
  var title = document.getElementById('player-title');
  var credit = document.getElementById('player-credit');
  var closeBtn = document.getElementById('player-close');
  var pp = document.getElementById('pp');
  var mute = document.getElementById('mute');
  var fsBtn = document.getElementById('fs');
  var scrub = document.getElementById('scrub');
  var fill = document.getElementById('fill');
  var buf = document.getElementById('buf');
  var cur = document.getElementById('cur');
  var dur = document.getElementById('dur');
  var opener = null, idleTimer = null, dragging = false;

  function fmt(t){ t = Math.max(0, Math.floor(t || 0)); var m = Math.floor(t / 60), s = t % 60; return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s; }
  function isOpen(){ return player.classList.contains('open'); }

  function render(){
    var d = v.duration || 0, t = v.currentTime || 0, pct = d ? t / d * 100 : 0;
    fill.style.width = pct + '%';
    cur.textContent = fmt(t);
    scrub.setAttribute('aria-valuenow', Math.round(pct));
    scrub.setAttribute('aria-valuetext', fmt(t) + ' of ' + fmt(d));
    if (v.buffered.length && d) buf.style.width = (v.buffered.end(v.buffered.length - 1) / d * 100) + '%';
  }
  function syncButtons(){
    pp.textContent = v.paused ? 'Play' : 'Pause';
    big.hidden = !v.paused;
    mute.textContent = v.muted ? 'Sound off' : 'Sound on';
  }
  function wake(){
    player.classList.remove('idle');
    clearTimeout(idleTimer);
    if (!v.paused && !dragging) idleTimer = setTimeout(function(){ player.classList.add('idle'); }, 2500);
  }
  function toggle(){ if (v.paused) { var p = v.play(); if (p && p.catch) p.catch(function(){}); } else v.pause(); wake(); }
  function seekTo(clientX){
    var r = scrub.getBoundingClientRect(), x = Math.min(Math.max(clientX - r.left, 0), r.width);
    if (v.duration) { v.currentTime = x / r.width * v.duration; render(); }
  }

  function open(btn){
    opener = btn;
    title.textContent = btn.dataset.title;
    credit.innerHTML = btn.dataset.credit;
    v.poster = btn.dataset.poster;
    v.src = btn.dataset.src;
    v.muted = false;
    fill.style.width = '0%'; buf.style.width = '0%'; cur.textContent = '00:00'; dur.textContent = '00:00';
    player.hidden = false;
    player.classList.add('open');
    document.body.classList.add('locked');
    if (reel) reel.pause();
    var p = v.play(); if (p && p.catch) p.catch(function(){ syncButtons(); });
    syncButtons(); wake();
    closeBtn.focus();
  }
  function close(){
    if (document.fullscreenElement) document.exitFullscreen().catch(function(){});
    v.pause(); v.removeAttribute('src'); v.load();
    clearTimeout(idleTimer);
    player.classList.remove('open', 'idle');
    player.hidden = true;
    document.body.classList.remove('locked');
    playReel();
    if (opener) opener.focus();
  }
  function fullscreen(){
    if (document.fullscreenElement) { document.exitFullscreen().catch(function(){}); return; }
    if (player.requestFullscreen) player.requestFullscreen().catch(function(){});
    else if (v.webkitEnterFullscreen) v.webkitEnterFullscreen();
  }

  document.querySelectorAll('.film').forEach(function(b){ b.addEventListener('click', function(){ open(b); }); });
  closeBtn.addEventListener('click', close);
  stage.addEventListener('click', function(e){ if (e.target === big || e.target === v || e.target === stage) toggle(); });
  stage.addEventListener('dblclick', fullscreen);
  pp.addEventListener('click', toggle);
  mute.addEventListener('click', function(){ v.muted = !v.muted; syncButtons(); wake(); });
  fsBtn.addEventListener('click', fullscreen);
  document.addEventListener('fullscreenchange', function(){ fsBtn.textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen'; });

  ['play','pause','volumechange'].forEach(function(ev){ v.addEventListener(ev, function(){ syncButtons(); wake(); }); });
  v.addEventListener('timeupdate', function(){ if (!dragging) render(); });
  v.addEventListener('progress', render);
  v.addEventListener('loadedmetadata', function(){ dur.textContent = fmt(v.duration); render(); });
  v.addEventListener('waiting', function(){ player.classList.add('loading'); });
  v.addEventListener('playing', function(){ player.classList.remove('loading'); });
  v.addEventListener('ended', function(){ v.currentTime = 0; player.classList.remove('idle'); syncButtons(); });

  scrub.addEventListener('pointerdown', function(e){ dragging = true; scrub.classList.add('drag'); scrub.setPointerCapture(e.pointerId); seekTo(e.clientX); wake(); });
  scrub.addEventListener('pointermove', function(e){ if (dragging) seekTo(e.clientX); });
  function endDrag(){ if (!dragging) return; dragging = false; scrub.classList.remove('drag'); wake(); }
  scrub.addEventListener('pointerup', endDrag);
  scrub.addEventListener('pointercancel', endDrag);

  player.addEventListener('pointermove', wake);
  player.addEventListener('touchstart', wake, { passive: true });

  document.addEventListener('keydown', function(e){
    if (!isOpen()) return;
    var k = e.key;
    if (k === 'Escape') { if (!document.fullscreenElement) close(); return; }
    if (k === ' ' || k === 'k' || k === 'K') { if (e.target.tagName === 'BUTTON' && k === ' ') return; e.preventDefault(); toggle(); }
    else if (k === 'ArrowRight') { e.preventDefault(); v.currentTime = Math.min((v.currentTime || 0) + 5, v.duration || 0); wake(); }
    else if (k === 'ArrowLeft') { e.preventDefault(); v.currentTime = Math.max((v.currentTime || 0) - 5, 0); wake(); }
    else if (k === 'm' || k === 'M') { v.muted = !v.muted; }
    else if (k === 'f' || k === 'F') { fullscreen(); }
    else if (k === 'Tab') {
      var f = Array.prototype.filter.call(player.querySelectorAll('button,[tabindex="0"]'), function(el){ return !el.hidden && el.offsetParent !== null; });
      var i = f.indexOf(document.activeElement);
      e.preventDefault();
      f[(i + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus();
      wake();
    }
  });
})();
</script>
</body>
</html>
